name: Windows application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'src/lib/mapBackups.js', 'src/lib/deviceBackupSchedule.js', 'tests/desktop*.mjs', '.github/workflows/desktop.yml', 'package.json', 'package-lock.json']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/desktop.test.mjs tests/desktopBackups.test.mjs
      - run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./desktop/electron-builder.cjs').extraMetadata.version"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Map Method для Windows $version" --notes "Установщик для Windows x64. Создаёт ярлыки на рабочем столе и в меню Пуск. Первый запуск требует подключения к интернету. Установщик без цифровой подписи."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag release/Map-Method-Setup.exe release/Map-Method-Setup.exe.blockmap release/latest.yml --repo $env:GITHUB_REPOSITORY --clobber
          exit $LASTEXITCODE
