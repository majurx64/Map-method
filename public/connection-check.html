<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MM — проверка соединения</title>
<style>
body{font:17px system-ui,sans-serif;background:#f5f1e8;color:#252525;max-width:760px;margin:50px auto;padding:20px;line-height:1.6}li{margin:12px 0;overflow-wrap:anywhere}button{font:inherit;padding:10px 18px;cursor:pointer}small{display:block;color:#555}
</style>
<h1>MM — проверка соединения</h1>
<p>Открой эту страницу без VPN. Проверка не открывает карты и не меняет данные.</p>
<p id="origin"></p><button id="run">Повторить проверку</button>
<ul id="results"></ul>
<p>Когда проверка закончится, пришли скрин результатов.</p>
<script>
const results = document.querySelector('#results');
const button = document.querySelector('#run');
document.querySelector('#origin').textContent = 'Адрес проверки: ' + location.host;
function row(label) {
  const item = document.createElement('li');
  item.textContent = label + ': проверяем…';
  results.append(item);
  return item;
}
async function download(url, label, acceptUnauthorized = false) {
  const item = row(label);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  const start = performance.now();
  try {
    const response = await fetch(url, {signal: controller.signal, cache: 'no-store', credentials: 'omit'});
    const text = await response.text();
    if (!response.ok && !(acceptUnauthorized && response.status === 401)) throw new Error('HTTP ' + response.status);
    item.textContent = label + ': ответ получен, ' + new TextEncoder().encode(text).length + ' байт, ' + ((performance.now()-start)/1000).toFixed(1) + ' с' + (acceptUnauthorized ? ' (это не проверка входа или карт)' : '');
    return text;
  } catch (error) {
    item.textContent = label + ': ' + (controller.signal.aborted ? 'не завершилось за 15 секунд' : 'ошибка загрузки — ' + error.message);
    return null;
  } finally { clearTimeout(timer); }
}
async function run() {
  button.disabled = true;
  results.replaceChildren();
  const html = await download(new URL('/', location.href), 'Основная HTML-страница');
  const jobs = [];
  if (html !== null) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const urls = [...doc.querySelectorAll('script[type="module"][src],link[rel="modulepreload"],link[rel="stylesheet"]')].map(el => new URL(el.getAttribute('src') || el.getAttribute('href'), location.origin));
    for (const url of urls) {
      if (url.origin !== location.origin && url.origin !== 'https://map-method-chi.vercel.app') continue;
      jobs.push(download(url, url.pathname.split('/').pop()));
    }
    if (!urls.length) row('В HTML не найдены файлы приложения').textContent = 'В HTML не найдены файлы приложения';
  }
  jobs.push(download('https://rwwzapmpdhuyqvyiyhhn.supabase.co/auth/v1/health', 'Доступность Supabase', true));
  await Promise.all(jobs);
  const done = document.createElement('li');
  done.textContent = 'Проверка завершена. Эта страница проверяет получение файлов, а не выполнение приложения.';
  results.append(done);
  button.disabled = false;
}
button.addEventListener('click', run);
run();
</script>
</html>
